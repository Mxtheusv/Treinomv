<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070c1a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Timer MV Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: app de uma tela, como timer de academia. Topo (modo e tempo total), painel de fase colorido com o tempo gigante, controles e abas embaixo. Visual único escuro (marca MV). */
:root {
  --bg: #070c1a;
  --panel: #10182e;
  --line: #22304f;
  --ink: #f3f6ff;
  --mut: #9fb0d0;
  --gold: #ffc400;
  --gold-ink: #121000;
  --blue: #1758de;
  --prep: #e9edf6;
  --prep-ink: #0b1430;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, button, a, input, label { touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }

/* topo */
.top { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.ibtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--gold); }
.ibtn svg { width: 28px; height: 28px; }
.ibtn:active { background: var(--panel); }
.ttl { text-align: center; font-family: var(--display); line-height: .95; }
.ttl #modeName { font-weight: 800; font-style: italic; font-size: 26px; letter-spacing: .02em; color: var(--gold); }
.ttl #total { font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; }
.ttl small { display: block; font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--mut); margin-top: 2px; }

/* painel da fase */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: var(--prep); color: var(--prep-ink); transition: background-color .25s ease, color .25s ease; user-select: none; overflow: hidden; }
.stage[data-k="work"] { background: var(--gold); color: var(--gold-ink); }
.stage[data-k="rest"], .stage[data-k="cyclerest"] { background: var(--blue); color: #fff; }
.stage[data-k="done"], .stage[data-k="idle"], .stage[data-k="crono"] { background: var(--panel); color: var(--ink); }
#phase { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 14vw, 96px); line-height: .9; letter-spacing: .01em; text-transform: uppercase; text-align: center; }
#big { font-family: var(--display); font-weight: 800; font-size: clamp(110px, 38vw, 260px); line-height: .85; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
#big .dec { font-size: .4em; opacity: .7; }
.stage[data-k="crono"] #big { font-size: clamp(90px, 30vw, 220px); }
.next { display: flex; flex-direction: column; align-items: center; margin-top: 10px; font-family: var(--display); line-height: .9; opacity: .9; }
.next span { font-weight: 700; font-size: clamp(22px, 6vw, 32px); text-transform: uppercase; }
.next b { font-weight: 800; font-size: clamp(40px, 12vw, 64px); font-variant-numeric: tabular-nums; }
#laps { list-style: none; margin: 10px 0 0; padding: 0; width: 100%; max-width: 360px; max-height: 26vh; overflow-y: auto; font-variant-numeric: tabular-nums; }
#laps li { display: flex; justify-content: space-between; padding: 6px 4px; border-top: 1px solid var(--line); font-weight: 600; color: var(--mut); }
#laps li b { color: var(--ink); }

/* controles */
.ctrl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.cnt { display: flex; flex-direction: column; align-items: center; text-align: center; font-family: var(--display); line-height: .95; min-width: 0; }
.cnt b { font-weight: 800; font-size: 64px; font-variant-numeric: tabular-nums; color: var(--gold); }
.cnt.alt b { color: var(--ink); }
.cnt span { font-weight: 700; font-size: 16px; letter-spacing: .03em; color: var(--mut); text-transform: uppercase; }
.lap { width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--ink); justify-self: center; }
.lap:active { background: var(--panel); }
.play { width: 112px; height: 112px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; box-shadow: 0 0 0 7px rgba(255,196,0,.18); transition: transform .12s ease; }
.play:active { transform: scale(.95); }
.play svg { width: 46px; height: 46px; }
.playlbl { grid-column: 2; text-align: center; font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--gold); letter-spacing: .04em; }

/* abas */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 16px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; color: var(--mut); }
.tab svg { width: 26px; height: 26px; }
.tab { white-space: nowrap; overflow: hidden; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--gold); }

/* ajustes */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(3,6,14,.72); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--panel); border-radius: 24px 24px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 30px; text-transform: uppercase; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.chip:active, .chip.on { border-color: var(--gold); color: var(--gold); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.field > span { font-weight: 600; font-size: 16px; }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); font-size: 24px; font-weight: 700; color: var(--gold); }
.tin { display: flex; align-items: center; gap: 2px; font-family: var(--display); font-weight: 800; font-size: 30px; }
.tin input { width: 2.1em; height: 48px; text-align: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; padding: 0; }
.tin input.n { width: 2.6em; }
.tin input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
.step output { min-width: 78px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 600; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); }
.summary { font-size: 14px; color: var(--mut); }
.summary b { color: var(--ink); }
.sheet-card > * { flex-shrink: 0; }
.done-btn { min-height: 54px; height: 54px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-weight: 700; font-size: 17px; }
@media (max-height: 700px) { .cnt b { font-size: 48px; } .play { width: 92px; height: 92px; } .lap { width: 80px; height: 80px; } .ttl #total { font-size: 28px; } }
@media (prefers-reduced-motion: reduce) { .stage, .play { transition: none; } }
html { height: 100%; }
body { margin: 0; height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.voltar { display: inline-flex; align-items: center; gap: 4px; margin: 8px 0 0 max(16px, env(safe-area-inset-left, 0px)); color: var(--gold); font-weight: 700; font-size: 14px; text-decoration: none; }
.app { height: 100%; }
body.de-app .app { height: calc(100% - 32px); }
</style>

</head>
<body>
<a class="voltar" id="voltar" href="/" hidden>‹ Voltar ao app</a>
<div class="app">
  <header class="top">
    <button class="ibtn" id="cfgBtn" aria-label="Ajustes do timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
    <div class="ttl"><div id="modeName">INTERVALOS</div><div id="total">04:10</div><small id="totalLbl">TEMPO TOTAL</small></div>
    <button class="ibtn" id="resetBtn" aria-label="Recomeçar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
  </header>

  <main class="stage" id="stage" data-k="idle" aria-live="polite">
    <div id="phase">PRONTO</div>
    <div id="big">00:10</div>
    <div class="next" id="next"><span id="nextLbl">EXERCÍCIO</span><b id="nextT">00:20</b></div>
    <ol id="laps" hidden></ol>
  </main>

  <section class="ctrl">
    <div class="cnt" id="cntL"><b id="rLeft">8</b><span id="rLbl">Rondas para terminar</span></div>
    <button class="play" id="playBtn" aria-label="Iniciar"><svg id="playIco" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></button>
    <div class="cnt alt" id="cntR"><b id="cLeft">1</b><span id="cLbl">Ciclos para terminar</span></div>
    <button class="lap" id="lapBtn" hidden>VOLTA</button>
    <div class="playlbl" id="playLbl">INICIAR</div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Modo do timer">
    <button class="tab" role="tab" data-mode="intervalos" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9.5 2h5M12 2v3"></path></svg>INTERVALOS</button>
    <button class="tab" role="tab" data-mode="emom" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2"></path><path d="M20 4v4h-4"></path><path d="M12 8v4l3 2"></path></svg>EMOM</button>
    <button class="tab" role="tab" data-mode="amrap" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"></path></svg>AMRAP</button>
    <button class="tab" role="tab" data-mode="crono" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><circle cx="12" cy="13" r="1" fill="currentColor"></circle><path d="M10 2h4"></path></svg>CRONÔMETRO</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Ajustes</h2>
    <div id="presetWrap"><div class="lbl" style="margin-bottom:8px">Prontos</div><div class="presets" id="presets"></div></div>
    <div id="fields"></div>
    <label class="toggle" for="somChk"><span>Bipes (3, 2, 1 e troca de fase)</span><input type="checkbox" id="somChk" checked></label>
    <label class="toggle" for="vozChk"><span>Voz falando a fase (Exercício, Descanso…)</span><input type="checkbox" id="vozChk" checked></label>
    <div class="summary">Toque no número para digitar o tempo exato. Se não ouvir os bipes no iPhone, aumente o volume.</div>
    <div class="summary" id="summary"></div>
    <button class="done-btn" id="doneBtn">Pronto</button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MODES = {
    intervalos: { nome: "INTERVALOS",
      campos: [["prep", "Preparar", "s"], ["work", "Exercício", "s"], ["rest", "Descanso", "s"], ["rounds", "Rondas", "n"], ["cycles", "Ciclos", "n"], ["cycleRest", "Descanso entre ciclos", "s"]],
      def: { prep: 10, work: 20, rest: 10, rounds: 8, cycles: 1, cycleRest: 60 },
      presets: [["Tabata 20/10 × 8", { work: 20, rest: 10, rounds: 8, cycles: 1 }], ["40/20 × 10", { work: 40, rest: 20, rounds: 10, cycles: 1 }], ["30/30 × 10", { work: 30, rest: 30, rounds: 10, cycles: 1 }], ["1 min / 1 min × 6", { work: 60, rest: 60, rounds: 6, cycles: 1 }], ["Tabata × 3 ciclos", { work: 20, rest: 10, rounds: 8, cycles: 3, cycleRest: 60 }]] },
    emom: { nome: "EMOM",
      campos: [["prep", "Preparar", "s"], ["every", "A cada", "s"], ["rounds", "Rondas", "n"]],
      def: { prep: 10, every: 60, rounds: 10 },
      presets: [["EMOM 10 min", { every: 60, rounds: 10 }], ["EMOM 20 min", { every: 60, rounds: 20 }], ["E2MOM 5 × 2 min", { every: 120, rounds: 5 }], ["A cada 30 s × 20", { every: 30, rounds: 20 }]] },
    amrap: { nome: "AMRAP",
      campos: [["prep", "Preparar", "s"], ["time", "Tempo total", "s"]],
      def: { prep: 10, time: 600 },
      presets: [["8 min", { time: 480 }], ["12 min", { time: 720 }], ["15 min", { time: 900 }], ["20 min", { time: 1200 }]] },
    crono: { nome: "CRONÔMETRO", campos: [], def: {}, presets: [] }
  };
  var LBL = { prep: "Prepare", work: "Exercício", rest: "Descanso", cyclerest: "Intervalo" };

  // ajustes salvos neste aparelho (se o navegador deixar)
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem("timerMV") || "{}") || {}; } catch (e) { saved = {}; }
  var cfg = {}; Object.keys(MODES).forEach(function (m) { cfg[m] = Object.assign({}, MODES[m].def, (saved.cfg || {})[m] || {}); });
  var mode = MODES[saved.mode] ? saved.mode : "intervalos";
  var som = saved.som !== false;
  var vozOn = saved.voz !== false;
  function persist() { try { localStorage.setItem("timerMV", JSON.stringify({ cfg: cfg, mode: mode, som: som, voz: vozOn })); } catch (e) { /* sem armazenamento */ } }

  // ---- sequência de fases do modo atual ----
  var seq = [], total = 0;
  function build() {
    var c = cfg[mode]; seq = [];
    if (mode === "intervalos") {
      if (c.prep) seq.push({ k: "prep", d: c.prep });
      for (var y = 0; y < c.cycles; y++) {
        for (var r = 0; r < c.rounds; r++) {
          seq.push({ k: "work", d: c.work, round: r + 1, cycle: y + 1 });
          var ultimaDoCiclo = r === c.rounds - 1;
          var temIntervalo = y < c.cycles - 1 && c.cycleRest > 0;
          if (c.rest > 0 && !(ultimaDoCiclo && (temIntervalo || y === c.cycles - 1))) seq.push({ k: "rest", d: c.rest, cycle: y + 1 });
        }
        if (y < c.cycles - 1 && c.cycleRest > 0) seq.push({ k: "cyclerest", d: c.cycleRest });
      }
    } else if (mode === "emom") {
      if (c.prep) seq.push({ k: "prep", d: c.prep });
      for (var i = 0; i < c.rounds; i++) seq.push({ k: "work", d: c.every, round: i + 1, cycle: 1, label: (c.every === 60 ? "Minuto " : "Ronda ") + (i + 1) });
    } else if (mode === "amrap") {
      if (c.prep) seq.push({ k: "prep", d: c.prep });
      seq.push({ k: "work", d: c.time, round: 1, cycle: 1, label: "AMRAP" });
    }
    var t = 0; seq.forEach(function (s) { s.ini = t; t += s.d; }); total = t;
  }

  // ---- relógio ----
  var acc = 0, t0 = 0, running = false, finished = false, lastIdx = -1, lastBeep = "", laps = [], lastLap = 0;
  function elapsed() { return acc + (running ? performance.now() - t0 : 0); }
  function fmt(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); }

  // ---- som (só começa depois de tocar em Iniciar) ----
  // Bipes gerados como pequenos arquivos WAV e tocados como mídia: no iPhone isso toca com o volume normal
  // (o áudio "de página" é cortado no modo silencioso). Se o navegador recusar, cai no sintetizador.
  var ac = null;
  function tone(f, ms, vol) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
    } catch (e) { /* sem áudio */ }
  }
  function wav(freq, ms, vol) {
    var sr = 22050, n = Math.floor(sr * ms / 1000), b = new ArrayBuffer(44 + n * 2), v = new DataView(b), i;
    function str(o, t) { for (var k = 0; k < t.length; k++) v.setUint8(o + k, t.charCodeAt(k)); }
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
    for (i = 0; i < n; i++) {
      var t = i / sr, env = Math.min(1, i / 200, (n - i) / 600);
      var sm = Math.sin(2 * Math.PI * freq * t) + 0.3 * Math.sin(2 * Math.PI * freq * 2 * t);
      v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, sm * vol * env)) * 32767, true);
    }
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  }
  var SONS = { curto: [880, 150], longo: [1175, 500], descanso: [587, 500], fim: [1320, 900] }, players = {}, liberado = false;
  try { Object.keys(SONS).forEach(function (k) { var a = new Audio(wav(SONS[k][0], SONS[k][1], 0.8)); a.preload = "auto"; players[k] = a; }); } catch (e) { players = {}; }
  function liberaSom() { // precisa acontecer dentro de um toque (regra dos celulares)
    if (liberado) return; liberado = true;
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) { /* sem controle de sessão */ }
    Object.keys(players).forEach(function (k) {
      var a = players[k]; a.muted = true;
      try { var p = a.play(); if (p && p.then) p.then(function () { a.pause(); a.currentTime = 0; a.muted = false; }).catch(function () { a.muted = false; }); } catch (e) { a.muted = false; }
    });
    tone(440, 1, 0.0001);
    try { if (window.speechSynthesis) { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) { /* sem voz */ }
  }
  function bip(k) {
    if (!som) return;
    var a = players[k];
    if (!a) { tone(SONS[k][0], SONS[k][1], 0.3); return; }
    try { a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function () { tone(SONS[k][0], SONS[k][1], 0.3); }); } catch (e) { tone(SONS[k][0], SONS[k][1], 0.3); }
  }
  // voz em português (usa a voz do próprio celular)
  var vozPt = null;
  function pegaVoz() { try { var vs = speechSynthesis.getVoices(); vozPt = vs.filter(function (x) { return /pt[-_]BR/i.test(x.lang); })[0] || vs.filter(function (x) { return /^pt/i.test(x.lang); })[0] || null; } catch (e) { vozPt = null; } }
  if (window.speechSynthesis) { pegaVoz(); speechSynthesis.onvoiceschanged = pegaVoz; }
  function fala(t, atraso) {
    if (!vozOn || !window.speechSynthesis || !t) return;
    setTimeout(function () {
      try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = "pt-BR"; if (vozPt) u.voice = vozPt; u.rate = 1.05; u.volume = 1; speechSynthesis.speak(u); } catch (e) { /* sem voz */ }
    }, atraso || 0);
  }
  function frase(seg, rondas) {
    if (seg.k === "prep") return "Prepare";
    if (seg.k === "rest") return "Descanso";
    if (seg.k === "cyclerest") return "Intervalo entre ciclos";
    if (mode === "amrap") return "Valendo!";
    if (mode === "emom") return seg.label + (rondas === 1 ? ", último" : "");
    return rondas === 1 ? "Última ronda! Exercício" : "Exercício";
  }
  function vibra(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* sem vibração */ } }

  // ---- tela acesa durante o treino ----
  var lock = null;
  function wake(on) {
    try {
      if (on && navigator.wakeLock && !lock) navigator.wakeLock.request("screen").then(function (l) { lock = l; l.addEventListener("release", function () { lock = null; }); }).catch(function () {});
      if (!on && lock) { lock.release(); lock = null; }
    } catch (e) { /* sem wake lock */ }
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && running) wake(true); });

  // ---- desenho ----
  function render() {
    var stage = $("stage");
    if (mode === "crono") {
      var ms = elapsed(), s = Math.floor(ms / 1000), d = Math.floor((ms % 1000) / 100);
      stage.dataset.k = "crono";
      $("phase").textContent = running ? "Correndo" : (ms ? "Pausado" : "Cronômetro");
      $("big").innerHTML = fmt(s) + '<span class="dec">.' + d + "</span>";
      $("total").textContent = fmt(s);
      $("rLeft").textContent = laps.length;
      return;
    }
    var e = elapsed() / 1000;
    if (!finished && e >= total && total > 0) { finish(); return; }
    if (finished) return;
    var idx = 0; for (var i = 0; i < seq.length; i++) if (e >= seq[i].ini) idx = i;
    var seg = seq[idx]; if (!seg) return;
    var rem = Math.ceil(seg.ini + seg.d - e - 1e-6);
    var started = running || acc > 0;
    stage.dataset.k = started ? seg.k : "idle";
    $("phase").textContent = started ? (seg.label || LBL[seg.k]) : "Pronto";
    $("big").textContent = fmt(started ? rem : seg.d);
    var nx = seq[idx + 1];
    $("next").style.visibility = nx ? "visible" : "hidden";
    if (nx) { $("nextLbl").textContent = (nx.label || LBL[nx.k]); $("nextT").textContent = fmt(nx.d); }
    $("total").textContent = fmt(Math.ceil(total - e - 1e-6));
    // rondas e ciclos que faltam (a atual conta)
    var rondas = 0, ciclos = {};
    for (var j = idx; j < seq.length; j++) if (seq[j].k === "work") { rondas++; ciclos[seq[j].cycle] = 1; }
    $("rLeft").textContent = rondas;
    $("cLeft").textContent = Object.keys(ciclos).length;
    // bipes
    if (running) {
      if (idx !== lastIdx) {
        if (lastIdx !== -1) { bip(seg.k === "work" ? "longo" : "descanso"); vibra(300); fala(frase(seg, rondas), som ? 450 : 0); }
        else if (e < 0.5) fala(frase(seg, rondas));
        lastIdx = idx;
      }
      if (rem <= 3 && rem >= 1) { var key = idx + ":" + rem; if (key !== lastBeep) { lastBeep = key; bip("curto"); } }
    }
  }
  function finish() {
    finished = true; running = false; acc = total * 1000; wake(false);
    $("stage").dataset.k = "done"; $("phase").textContent = "Fim do treino";
    $("big").textContent = "00:00"; $("next").style.visibility = "hidden";
    $("total").textContent = "00:00"; $("rLeft").textContent = 0; $("cLeft").textContent = 0;
    bip("fim"); vibra([300, 120, 300, 120, 600]); fala("Fim do treino. Bom trabalho!", som ? 900 : 0);
    setPlay();
  }
  function setPlay() {
    $("playIco").innerHTML = running ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path>' : '<path d="M8 5.5v13l11-6.5z"></path>';
    $("playBtn").setAttribute("aria-label", running ? "Pausar" : "Iniciar");
    $("playLbl").textContent = running ? "PAUSAR" : (finished ? "DE NOVO" : (acc > 0 ? "CONTINUAR" : "INICIAR"));
  }
  function loop() { render(); if (running) requestAnimationFrame(loop); }
  setInterval(function () { if (running) render(); }, 250); // segue contando com a aba em segundo plano

  function toggle() {
    if (finished) reset();
    if (running) { acc = elapsed(); running = false; wake(false); }
    else { liberaSom(); t0 = performance.now(); running = true; wake(true); requestAnimationFrame(loop); }
    setPlay(); render();
  }
  function reset() { running = false; finished = false; acc = 0; lastIdx = -1; lastBeep = ""; laps = []; lastLap = 0; $("laps").innerHTML = ""; wake(false); build(); setPlay(); render(); }

  function lap() {
    if (mode !== "crono" || (!running && !acc)) return;
    var now = elapsed(), parcial = now - lastLap; lastLap = now; laps.unshift(parcial);
    var n = laps.length;
    var li = document.createElement("li");
    li.innerHTML = "<span>Volta " + n + "</span><b>" + fmt(Math.floor(parcial / 1000)) + "." + Math.floor((parcial % 1000) / 100) + "</b>";
    $("laps").insertBefore(li, $("laps").firstChild);
    render();
  }

  // ---- troca de modo ----
  function setMode(m) {
    mode = m; persist();
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.mode === m)); });
    $("modeName").textContent = MODES[m].nome;
    var crono = m === "crono";
    $("cfgBtn").style.visibility = crono ? "hidden" : "visible";
    $("cntR").hidden = crono; $("lapBtn").hidden = !crono; $("laps").hidden = !crono;
    $("next").style.display = crono ? "none" : "";
    $("rLbl").textContent = crono ? "Voltas" : "Rondas para terminar";
    $("cntR").style.visibility = m === "intervalos" ? "visible" : "hidden";
    $("totalLbl").textContent = crono ? "TEMPO CORRIDO" : "TEMPO TOTAL";
    reset();
  }

  // ---- ajustes ----
  function passo(v, tipo, dir) {
    if (tipo === "n") return Math.max(1, Math.min(99, v + dir));
    var st = v < 60 || (v === 60 && dir < 0) ? 5 : (v < 300 || (v === 300 && dir < 0) ? 15 : 60);
    return Math.max(0, Math.min(3600, v + dir * st));
  }
  function minimo(campo) { return campo === "work" || campo === "every" || campo === "time" ? 5 : 0; }
  function drawSheet() {
    var M = MODES[mode], c = cfg[mode];
    $("sheetTitle").textContent = "Ajustes · " + M.nome;
    $("presets").innerHTML = M.presets.map(function (p, i) { return '<button class="chip" data-p="' + i + '">' + p[0] + "</button>"; }).join("");
    $("fields").innerHTML = M.campos.map(function (f) {
      var v = c[f[0]];
      var meio = f[2] === "s"
        ? '<div class="tin"><input inputmode="numeric" pattern="[0-9]*" maxlength="2" id="in-' + f[0] + '-m" data-in="' + f[0] + '" data-part="m" value="' + String(Math.floor(v / 60)).padStart(2, "0") + '" aria-label="' + f[1] + ': minutos">:<input inputmode="numeric" pattern="[0-9]*" maxlength="2" id="in-' + f[0] + '-s" data-in="' + f[0] + '" data-part="s" value="' + String(v % 60).padStart(2, "0") + '" aria-label="' + f[1] + ': segundos"></div>'
        : '<div class="tin"><input class="n" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="in-' + f[0] + '" data-in="' + f[0] + '" data-part="n" value="' + v + '" aria-label="' + f[1] + '"></div>';
      return '<div class="field"><span>' + f[1] + '</span><div class="step"><button data-f="' + f[0] + '" data-d="-1" aria-label="Diminuir ' + f[1] + '">−</button>' + meio + '<button data-f="' + f[0] + '" data-d="1" aria-label="Aumentar ' + f[1] + '">+</button></div></div>';
    }).join("");
    build();
    $("summary").innerHTML = "Duração total: <b>" + fmt(total) + "</b>";
    $("somChk").checked = som; $("vozChk").checked = vozOn;
  }
  function lerCampo(f) {
    var campo = MODES[mode].campos.filter(function (x) { return x[0] === f; })[0]; if (!campo) return;
    var num = function (el) { var n = parseInt((el && el.value || "").replace(/\D/g, ""), 10); return isNaN(n) ? 0 : n; };
    var v;
    if (campo[2] === "n") v = Math.max(1, Math.min(99, num($("in-" + f))));
    else v = Math.max(minimo(f), Math.min(3600, num($("in-" + f + "-m")) * 60 + Math.min(59, num($("in-" + f + "-s")))));
    cfg[mode][f] = v; persist(); drawSheet();
  }
  $("fields").addEventListener("change", function (ev) { var el = ev.target.closest("[data-in]"); if (el) lerCampo(el.dataset.in); });
  $("fields").addEventListener("focusin", function (ev) { var el = ev.target.closest("[data-in]"); if (el) setTimeout(function () { try { el.select(); } catch (e) {} }, 0); });
  $("fields").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { var el = ev.target.closest("[data-in]"); if (el) el.blur(); } });
  $("presets").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-p]"); if (!b) return;
    Object.assign(cfg[mode], MODES[mode].presets[+b.dataset.p][1]); persist(); drawSheet();
  });
  $("fields").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-f]"); if (!b) return;
    var f = b.dataset.f, campo = MODES[mode].campos.filter(function (x) { return x[0] === f; })[0];
    cfg[mode][f] = Math.max(minimo(f), passo(cfg[mode][f], campo[2], +b.dataset.d)); persist(); drawSheet();
  });
  $("somChk").addEventListener("change", function () { som = $("somChk").checked; persist(); });
  $("vozChk").addEventListener("change", function () { vozOn = $("vozChk").checked; persist(); if (vozOn) { liberaSom(); fala("Voz ligada"); } });
  function openSheet() { if (running) toggle(); drawSheet(); $("sheet").hidden = false; $("doneBtn").focus(); }
  function closeSheet() { var a = document.activeElement; if (a && a.dataset && a.dataset.in) lerCampo(a.dataset.in); $("sheet").hidden = true; reset(); }
  $("cfgBtn").addEventListener("click", openSheet);
  $("doneBtn").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", function (ev) { if (ev.target === $("sheet")) closeSheet(); });
  document.addEventListener("keydown", function (ev) {
    if (!$("sheet").hidden) { if (ev.key === "Escape") closeSheet(); return; }
    if (ev.code === "Space" && ev.target === document.body) { ev.preventDefault(); toggle(); }
  });

  $("playBtn").addEventListener("click", toggle);
  $("resetBtn").addEventListener("click", reset);
  $("lapBtn").addEventListener("click", lap);
  document.querySelectorAll(".tab").forEach(function (t) { t.addEventListener("click", function () { if (t.dataset.mode !== mode) setMode(t.dataset.mode); }); });

  if (/[?&]de=app/.test(location.search)) { $("voltar").hidden = false; document.body.classList.add("de-app"); }
  setMode(mode);
})();
</script>

</body>
</html>
